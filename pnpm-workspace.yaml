packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  "@prisma/engines": true
  argon2: true
  esbuild: true
  prisma: true

# Pinned versions newer than pnpm's minimum release age.
minimumReleaseAgeExclude:
  - "@eslint/config-array@0.23.6"
  - eslint@10.15.0
